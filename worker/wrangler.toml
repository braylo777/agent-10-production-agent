name = "agent-10-production-agent"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

[ai]
binding = "AI"   # Workers AI free tier (10k neurons/day), no API keys

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1010"
simple = { limit = 5, period = 60 }

[observability]
enabled = true   # structured request logs in Workers Logs
